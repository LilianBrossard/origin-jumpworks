name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, format, tests, build, e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Types
        run: pnpm typecheck

      - name: Format
        run: pnpm format:check

      - name: Tests
        run: pnpm test

      - name: Build (export statique)
        run: pnpm build

      # Parcours et accessibilité (axe) sur le site exporté, avec le Chrome du runner
      - name: Tests de bout en bout
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
